<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Login - Project Echo</title>
  <style>
    /* ── BASE & BACKGROUND ────────── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── CSS TWINKLING STARS ──────── */
    .star {
      position: absolute;
      color: #fbbf24; /* Soft warm gold star */
      font-size: 24px;
      opacity: 0.6;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(251, 191, 36, 0.4);
      animation: twinkle 3s infinite ease-in-out;
      user-select: none;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 0.8; transform: scale(1.15) rotate(15deg); }
    }

    /* ── LOGIN CARD ───────────────── */
    .login-container {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 20px 40px rgba(225, 29, 72, 0.06);
      border: 1px solid rgba(225, 29, 72, 0.08);
      z-index: 10;
      animation: cardSlideUp 0.4s ease-out;
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Title & Greeting */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #64748b;
    }

    /* Message Alert Block (for errors and success loading) */
    #message {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      font-weight: 500;
    }
    #message.success {
      background: #dcfce7;
      border-left: 3.5px solid #22c55e;
      color: #1565c0; /* Uses server colors */
      color: #14532d;
      display: block;
    }
    #message.error {
      background: #fef2f2;
      border-left: 3.5px solid #ef4444;
      color: #991b1b;
      display: block;
    }

    /* Inputs */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      color: #475569;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13px;
      color: #0f172a;
      outline: none;
      background-color: #f8fafc;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .form-group input::placeholder {
      color: #94a3b8;
    }
    .form-group input:focus {
      border-color: #f43f5e; /* Rose pink border on focus */
      background-color: white;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.08);
    }

    /* Gradient Login Button */
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #f43f5e, #e11d48); /* Soft rose-pink gradient */
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
      transition: all 0.2s ease;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(244, 63, 94, 0.3);
    }
    .btn:disabled {
      background: #fda4af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Bottom Register Link */
    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }
    .register-link a {
      color: #f43f5e;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }
    .register-link a:hover {
      color: #be123c;
      text-decoration: underline;
    }
  </style>

<script id="floating-squares-script">
document.addEventListener("DOMContentLoaded", function() {
    if (document.getElementById('floating-squares-canvas')) return;

    // Create canvas for animated floating squares
    var canvas = document.createElement('canvas');
    canvas.id = 'floating-squares-canvas';
    canvas.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;';
    document.body.insertBefore(canvas, document.body.firstChild);

    var ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', function() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    // Create floating squares
    var squares = [];
    var count = 18;
    for (var i = 0; i < count; i++) {
        squares.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 80 + 30,
            speed: Math.random() * 0.4 + 0.1,
            opacity: Math.random() * 0.18 + 0.05,
            angle: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.005,
            borderRadius: Math.random() * 20 + 10
        });
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        squares.forEach(function(sq) {
            ctx.save();
            ctx.translate(sq.x, sq.y);
            ctx.rotate(sq.angle);
            ctx.globalAlpha = sq.opacity;
            ctx.fillStyle = 'rgba(100, 149, 237, 0.6)';
            ctx.strokeStyle = 'rgba(150, 190, 255, 0.3)';
            ctx.lineWidth = 1.5;
            roundRect(ctx, -sq.size/2, -sq.size/2, sq.size, sq.size, sq.borderRadius, true, true);
            ctx.restore();

            // Move upward slowly
            sq.y -= sq.speed;
            sq.angle += sq.rotSpeed;

            // Reset when off screen
            if (sq.y + sq.size < 0) {
                sq.y = canvas.height + sq.size;
                sq.x = Math.random() * canvas.width;
            }
        });

        requestAnimationFrame(animate);
    }

    animate();
});
</script>


<!-- LOGIN EVENT RECORDER -->
<script id="login-event-recorder">
(function() {
    // Record login IMMEDIATELY when page loads (user just logged in = they came from login page)
    function recordLogin() {
        var now = new Date();
        var logs = JSON.parse(localStorage.getItem('real_activity_logs') || '[]');
        
        // Check if we already recorded this session
        var sessionKey = 'login_session_' + now.toDateString();
        if (localStorage.getItem(sessionKey)) return;
        localStorage.setItem(sessionKey, '1');
        
        logs.push({
            action: 'Login',
            details: 'User authenticated successfully into Project Echo',
            dateStr: now.toLocaleString('en-IN'),
            timestamp: now.getTime(),
            type: 'login'
        });
        localStorage.setItem('real_activity_logs', JSON.stringify(logs));
        localStorage.setItem('last_login_time', now.toLocaleString('en-IN'));
    }

    // Record when form is submitted
    window.addEventListener('load', function() {
        var forms = document.querySelectorAll('form');
        forms.forEach(function(form) {
            form.addEventListener('submit', function(e) {
                var now = new Date();
                var logs = JSON.parse(localStorage.getItem('real_activity_logs') || '[]');
                logs.push({
                    action: 'Login',
                    details: 'User authenticated successfully into Project Echo',
                    dateStr: now.toLocaleString('en-IN'),
                    timestamp: now.getTime(),
                    type: 'login'
                });
                localStorage.setItem('real_activity_logs', JSON.stringify(logs));
                localStorage.setItem('last_login_time', now.toLocaleString('en-IN'));
                
                // Count logins
                var count = parseInt(localStorage.getItem('total_login_count') || '0') + 1;
                localStorage.setItem('total_login_count', count.toString());
            });
        });

        // Also capture button clicks
        var buttons = document.querySelectorAll('button, input[type="submit"], .btn');
        buttons.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var txt = (this.textContent || this.value || '').toLowerCase();
                if (txt.includes('login') || txt.includes('sign in') || txt.includes('continue') || txt.includes('submit')) {
                    var now = new Date();
                    var logs = JSON.parse(localStorage.getItem('real_activity_logs') || '[]');

                        action: 'Login',

                        dateStr: now.toLocaleString('en-IN'),
                        timestamp: now.getTime(),
                        type: 'login'
                    });
                    localStorage.setItem('real_activity_logs', JSON.stringify(logs));

                    setTimeout(function() { window.location.href = '/dashboard.html'; }, 200);

            });
        });
    });
})();

<script id="ultimate-bug-fixes">
  // 1. GLOBAL ACTIVITY LOGGER
  function logGlobalActivity(title, desc, icon) {
      try {
          let acts = JSON.parse(localStorage.getItem('global_activity') || '[]');
          acts.push({ title: title, desc: desc, icon: icon, date: Date.now() });
          localStorage.setItem('global_activity', JSON.stringify(acts));
      } catch(e) {}
  }

  // 2. TRACK LOGIN
  if (!sessionStorage.getItem('session_active')) {
      logGlobalActivity('System Login', 'User successfully authenticated and logged in.', '🔐');
      sessionStorage.setItem('session_active', 'true');
  }

  // 3. TRACK LOGOUT & AUTO-REFRESH ON 'ADD' BUTTONS
  document?.addEventListener('click', function(e) {
      // Handle Logout Tracking
      if(e.target.closest('#logoutBtn') || e.target.closest('.logout-item')) {
          logGlobalActivity('System Logout', 'User securely signed out.', '🚪');
      }
      
      // Handle Auto-Refresh for Add/Save buttons
      let btn = e.target.closest('button');
      if (btn) {
          let txt = btn.innerText.toLowerCase();
          if (txt.includes('add') || txt.includes('save') || txt.includes('submit')) {
              // Wait 300ms for localStorage to save, then trigger update
              setTimeout(() => {
                  // If there is a "Show All" button, click it automatically
                  let showAll = Array.from(document.querySelectorAll('button')).find(b => b.innerText.toLowerCase().includes('show'));
                  if (showAll) {
                      showAll.click();
                  } else {
                      // Otherwise, force a page reload to guarantee the new data appears immediately!
                      window.location.reload();
                  }
              }, 400);
          }
      }
  });
</script>

<!-- UNIVERSAL AUTO-SYNC ENGINE V3 (SILENT) -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    if(window.universalSyncEngineInstalled) return;
    window.universalSyncEngineInstalled = true;
    
    if(window.location.pathname.toLowerCase().includes('habit')) return;

    let path = window.location.pathname.toLowerCase();
    let pageTitle = document.title.toLowerCase();
    let storageKey = 'global_data';
    
    if(path.includes('income') || path.includes('expense') || pageTitle.includes('income')) storageKey = 'income_data';
    else if(path.includes('saving') || pageTitle.includes('saving')) storageKey = 'savings_data';
    else if(path.includes('study') || pageTitle.includes('study')) storageKey = 'study_data';
    else if(path.includes('academic') || pageTitle.includes('academic')) storageKey = 'academics_data';
    else if(path.includes('fitness') || pageTitle.includes('fitness')) storageKey = 'fitness_data';
    else if(path.includes('goal') || pageTitle.includes('goal')) storageKey = 'goals_data';

    document.addEventListener('click', (e) => {
        let btn = e.target.closest('button, .btn, input[type="submit"]');
        if(btn && (btn.textContent.toLowerCase().includes('add') || btn.textContent.toLowerCase().includes('save') || btn.textContent.toLowerCase().includes('create') || btn.value === 'Add')) {
            
            let container = btn.closest('div, section, form, header, .card');
            if(!container && btn.parentElement) container = btn.parentElement.parentElement;
            if(!container) return;

            let inputs = container.querySelectorAll('input[type="text"], input[type="number"]');
            let selects = container.querySelectorAll('select');
            
            if(inputs.length > 0 && inputs[0].value.trim() !== '') {
                
                let val1 = inputs[0].value.trim();
                let val2 = inputs.length > 1 ? inputs[1].value.trim() : '';
                if(!val2 && selects.length > 0) val2 = selects[0].options[selects[0].selectedIndex].text;

                // Save to memory perfectly
                let currentData = JSON.parse(localStorage.getItem(storageKey) || '[]');
                currentData.push({ text: val1, extra: val2, date: Date.now() });
                localStorage.setItem(storageKey, JSON.stringify(currentData));
                
                // Instantly alert the Dashboard!
                window.dispatchEvent(new Event('storage'));

                // Auto-update large money numbers if on Savings/Income pages
                let numVal = parseFloat((val1 + val2).replace(/[^0-9.]/g, ''));
                if(!isNaN(numVal) && numVal > 0) {
                    document.querySelectorAll('h1, h2, h3').forEach(h => {
                        if(h.textContent.includes('₹') || h.textContent.includes('$')) {
                            let current = parseFloat(h.textContent.replace(/[^0-9.]/g, '')) || 0;
                            let prefix = h.textContent.includes('₹') ? '₹' : '$';
                            h.textContent = prefix + (current + numVal).toLocaleString();
                        }
                    });
                }

                // Clean the input box, BUT DO NOT DRAW ANY UGLY UI BOXES!
                inputs.forEach(i => i.value = ''); 
            }
        }
    });
});
</script>

<!-- CLEAN LOGIN HANDLER -->
<script>
(function() {
    window.addEventListener("load", function() {
        // Find all forms and intercept submission
        var allForms = document.getElementsByTagName("form");
        for (var i = 0; i < allForms.length; i++) {
            allForms[i].onsubmit = function(e) {
                e.preventDefault();
                // Record login
                try {
                    var logs = JSON.parse(localStorage.getItem('real_activity_logs') || '[]');
                    logs.push({ action: 'Login', details: 'User authenticated', dateStr: new Date().toLocaleString() });
                    localStorage.setItem('real_activity_logs', JSON.stringify(logs));
                } catch(err) {}
                window.location.href = '/dashboard.html';
                return false;
            };
        }
        
        // Also find any button/link that says Continue or Login
        var allBtns = document.querySelectorAll("button, a, input[type='submit']");
        for (var j = 0; j < allBtns.length; j++) {
            var txt = (allBtns[j].textContent || allBtns[j].value || '').toLowerCase();
            if (txt.indexOf('continue') !== -1 || txt.indexOf('login') !== -1 || txt.indexOf('submit') !== -1) {
                allBtns[j].onclick = function(e) {
                    e.preventDefault();
                    window.location.href = '/dashboard.html';
                    return false;
                };
            }
        }
    });
})();
</script>
